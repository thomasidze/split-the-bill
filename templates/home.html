{% import "_ui.html" as ui %}
<section data-main-text="Новое событие" data-main-get="/view/events/new">
  <p class="eyebrow">Делим счёт</p>
  <h1>{{ chat.title }}</h1>

  {% for card in cards %}
    {% set people = card.event.participants %}
    <button class="event-card" style="{{ ui.theme(card.event) }}"
            hx-get="/view/events/{{ card.event.id }}" hx-target="#app" data-haptic>
      <span class="card-row">
        <span class="card-title">{{ card.event.title }}</span>
        <span class="card-amount">{{ card.total | rub }}</span>
      </span>
      <span class="card-line">
        {% if card.my_balance < 0 %}ты должен {{ (-card.my_balance) | rub }}
        {% elif card.my_balance > 0 %}тебе должны {{ card.my_balance | rub }}
        {% else %}в расчёте{% endif %}
      </span>
      <span class="card-row card-bottom">
        <span class="avatars">
          {% for participant in people[:5] %}{{ ui.avatar(participant.user) }}{% endfor %}
          {% if people | length > 5 %}<span class="avatar avatar-more">+{{ people | length - 5 }}</span>{% endif %}
        </span>
        {% if card.unclaimed %}
          <span class="pill">не разобрано {{ card.unclaimed | rub }}</span>
        {% endif %}
      </span>
    </button>
  {% else %}
    <div class="empty">
      <div class="empty-icon">🧾</div>
      Событий пока нет — создай первое
    </div>
  {% endfor %}
</section>
